# Builds the site and publishes it to GitHub Pages at https://mark1russell7.github.io/rigor/, with the shared
# Pages workflow of mark1russell7 (reusable-pages.yml of mark1russell7/template, its CI.md).
# The Pages source of the repository is "GitHub Actions" (Settings > Pages).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One deployment at a time. A newer push cancels a deployment that waits.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    uses: mark1russell7/template/.github/workflows/reusable-pages.yml@20dea158bc3a00838428ea75cbe6ff88b25606bb # main
    # The build job of the shared workflow gets only the read permissions. Only its deploy job,
    # which runs no code of the repository, writes to Pages.
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
      pages: write
      id-token: write
    with:
      build: node packages/site/src/build.ts --out dist
      out: packages/site/dist
      site-pages: true
      site-name: rigor
      roadmap: docs/ROADMAP.md

  # This job examines the deployed site: the page, its script and the pages of site-pages.
  # It starts no code of the repository and reads only the public site.
  served:
    needs: pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: The site has the page, its script and the site pages
        shell: bash
        env:
          SITE: ${{ needs.pages.outputs.page-url }}
        run: |
          set -euo pipefail
          for f in "" page.js data/releases.json data/status.json releases/ status/; do
            # A new deployment can take some seconds to be served, so each file gets 5 tries.
            ok=0
            for i in 1 2 3 4 5; do
              if curl -fsS -o /dev/null "${SITE%/}/$f"; then ok=1; break; fi
              sleep 10
            done
            if [ "$ok" != 1 ]; then echo "::error::The site has no /$f."; exit 1; fi
            echo "The site has /$f."
          done
          curl -fsS "${SITE%/}/" | grep -q 'src="page.js"' || { echo "::error::The page does not load page.js."; exit 1; }
