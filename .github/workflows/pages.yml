# Builds the site and publishes it to GitHub Pages at https://mark1russell7.github.io/rigor/, with the shared
# Pages workflow of mark1russell7 (reusable-pages.yml of mark1russell7/template, its CI.md).
# The Pages source of the repository is "GitHub Actions" (Settings > Pages).
name: Pages

on:
  push:
    branches: [main]
  # After a release, so that the Releases page has the new version
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  # Each day, in case a release fails after it publishes
  schedule:
    - cron: "15 5 * * *"

permissions: {}

# One deployment at a time. A newer push cancels a deployment that waits.
# Each pull request has its own group, so its check does not cancel a deployment.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pages:
    uses: mark1russell7/template/.github/workflows/reusable-pages.yml@130d7d6038dfa2e32fb0d6f01c385f22046a752f # main
    # The build job of the shared workflow gets only the read permissions. Only its deploy job,
    # which runs no code of the repository, writes to Pages.
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
      pages: write
      id-token: write

  # This job examines the deployed site: the page, its script and the pages of site-pages.
  # It starts no code of the repository and reads only the public site.
  # When the shared workflow deploys nothing, it gives no page URL, and this job does not start.
  # For example, a red CI of the commit on main stops the deploy.
  served:
    needs: pages
    if: github.event_name != 'pull_request' && needs.pages.outputs.page-url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: The site has the page, its script and the site pages
        shell: bash
        env:
          SITE: ${{ needs.pages.outputs.page-url }}
        run: |
          set -euo pipefail
          for f in "" page.js data/releases.json data/status.json releases/ status/; do
            # A new deployment can take some seconds to be served, so each file gets 5 tries.
            ok=0
            for i in 1 2 3 4 5; do
              if curl -fsS -o /dev/null "${SITE%/}/$f"; then ok=1; break; fi
              sleep 10
            done
            if [ "$ok" != 1 ]; then echo "::error::The site has no /$f."; exit 1; fi
            echo "The site has /$f."
          done
          # The page goes to a file first. In a pipe, grep -q can exit before the last write of curl, and
          # pipefail then fails the step on a correct page (main at b9845df).
          page="$RUNNER_TEMP/page.html"
          curl -fsS --retry 4 --retry-delay 10 --retry-all-errors -o "$page" "${SITE%/}/"
          grep -q 'src="page.js"' "$page" || { echo "::error::The page does not load page.js."; exit 1; }
