# The CI of this repository. The job ci is the shared CI of mark1russell7 (reusable-ci.yml, CI.md)
# with its default inputs: it runs each standard script that package.json has (format:check,
# typecheck, lint, check:conventions, test, build in each package that has it, check:boundaries, check:api and lint:ste).
name: CI

on:
  push:
  pull_request:
  # release.yml starts these gates before a release
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@f48f29fe5b00772951e0910a90fbbe312343338c # main

  # Each preset of `pnpm package add` makes a package, and that package passes its typecheck and its tests.
  # The tests of the preset service hold its entry to describe() and lint() of @mark1russell7/service (OTH-5).
  # A test of the CLI compares this list with the presets of the CLI.
  # Only the template has the source of the CLI (packages/cli), so a repository from new-repo.ps1 skips this job.
  presets:
    if: github.repository == 'mark1russell7/template'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        preset: [node, node-cjs, ts, vite, react, service]
    env:
      PACKAGE: demo-${{ matrix.preset }}
      PRESET: ${{ matrix.preset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package add "$PACKAGE" --preset="$PRESET"
      # The new package changes the lockfile
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter "@template/$PACKAGE" typecheck
      - run: pnpm --filter "@template/$PACKAGE" test

  # A code stamp must be the same on each operating system. Each job reads the stamps of its own, with CRLF line ends on Windows.
  # The compare has no fixed value, so a new version of the bundler does not fail it.
  stamp-read:
    name: Stamp read (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/stamp-os.ts read . stamp-read.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stamp-read-${{ matrix.os }}
          path: stamp-read.json
          retention-days: 3

  stamp-compare:
    name: Stamp compare
    needs: stamp-read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: stamp-read-*
          path: stamp-reads
      - run: node scripts/stamp-os.ts compare stamp-reads/stamp-read-ubuntu-latest/stamp-read.json stamp-reads/stamp-read-windows-latest/stamp-read.json

  # The one check of the ruleset of main (CI.md of mark1russell7/template, "The check of the ruleset").
  # It passes only when each job of needs passed, or was skipped by its own if and ALLOW_SKIP names it.
  # A new job of this file goes in needs, so the ruleset never has to change, and gh pr merge --auto
  # waits for the whole gate.
  ci-ok:
    name: CI OK
    if: always()
    needs: [ci, presets, stamp-read, stamp-compare]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Each job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          # The jobs that their own if may skip, separated by spaces. Each other job must pass.
          ALLOW_SKIP: "presets"
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"' > results
          cat results
          if [ ! -s results ]; then echo "::error::no job in needs"; exit 1; fi
          bad=0
          while read -r job result; do
            case "$result" in
              success) ;;
              skipped) case " $ALLOW_SKIP " in *" $job "*) ;; *) echo "::error::$job was skipped, and ALLOW_SKIP does not name it"; bad=1 ;; esac ;;
              *) echo "::error::$job: $result"; bad=1 ;;
            esac
          done < results
          exit $bad
