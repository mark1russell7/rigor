# The bench of sha256Hex: node:crypto against the portable code, each arm in a fresh process with rigor-bench, and an A/A pair
# of the native arm for the noise floor. It runs on each pull request that changes the hash, and a person can start it:
# gh workflow run bench-sha256.yml -f rounds=12
# The artifact holds the raw time of each child and the computer, as JSON.
name: Bench sha256

on:
  pull_request:
    paths:
      - packages/generators/src/hash.ts
      - scripts/bench-sha256.ts
      - scripts/bench-sha256-child.ts
      - .github/workflows/bench-sha256.yml
  workflow_dispatch:
    inputs:
      rounds:
        description: The count of rounds. Each round starts one child of each arm
        type: string
        required: true
        default: "12"

permissions:
  contents: read

concurrency:
  group: bench-sha256-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  bench:
    name: Bench sha256
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the bench
        env:
          ROUNDS: ${{ inputs.rounds || '12' }}
        run: |
          node scripts/bench-sha256.ts --rounds "$ROUNDS" --out bench-sha256.json | tee summary.txt
          { echo "## Bench sha256: $ROUNDS rounds"; echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-sha256-${{ github.run_id }}
          path: bench-sha256.json
          retention-days: 90
          if-no-files-found: error
