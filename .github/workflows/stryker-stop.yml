name: Stryker stop

# One real run of Stryker on a fixture lane, which a TERM stops. It checks that Stryker loads the reporter
# rigor-partial from the build, and that `rigor-mutation scores` gives a partial score after the stop.
on:
  pull_request:
    paths:
      - "packages/mutation/**"
      - ".github/workflows/stryker-stop.yml"
  push:
    branches: [main]
    paths:
      - "packages/mutation/**"
      - ".github/workflows/stryker-stop.yml"

permissions:
  contents: read

concurrency:
  group: stryker-stop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mark1russell7/rigor-mutation build
      - run: bash packages/mutation/test/stryker/stop.sh
